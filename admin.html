<style>
/* Layout: sticky navy bar, then a KPI strip, one trend chart, and a grid of ranked lists. Built for scanning, not reading. */
:root{--bg:#f6f5f1;--surface:#fff;--ink:#1d2430;--muted:#5d6675;--line:#d9d8d2;--steel:#27364a;--steel-ink:#fff;--gold:#f2b705;--gold-ink:#1d2430;--s1:#2a78d6;--s2:#eb6834;--bar:#2a78d6;--track:#e9e8e2;--warn-bg:#fff4d6;--warn-ink:#6b4e00;--err:#b3261e;
  --disp:"Barlow Condensed","Arial Narrow",sans-serif;--body:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a23;--surface:#1c2431;--ink:#eef0f3;--muted:#9aa4b4;--line:#2e3849;--steel:#0e131b;--s1:#3987e5;--s2:#d95926;--bar:#3987e5;--track:#27303f;--warn-bg:#3a3014;--warn-ink:#f3d98a;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a23;--surface:#1c2431;--ink:#eef0f3;--muted:#9aa4b4;--line:#2e3849;--steel:#0e131b;--s1:#3987e5;--s2:#d95926;--bar:#3987e5;--track:#27303f;--warn-bg:#3a3014;--warn-ink:#f3d98a;--err:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);margin:0;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--steel);z-index:30}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--steel);color:var(--steel-ink);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:700 24px/1 var(--disp);letter-spacing:.01em;margin-right:auto}.brand b{color:var(--gold);font-weight:700}.brand small{font:500 13px var(--body);opacity:.7;margin-left:10px;letter-spacing:.04em;text-transform:uppercase}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel,.btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:var(--steel-ink);border-radius:6px;padding:8px 12px;min-height:40px;cursor:pointer}
.sel option{color:#1d2430}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.who{font-size:14px;opacity:.8}
main{max-width:1180px;margin:0 auto;padding-top:22px;display:grid;gap:18px}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:10px 14px;font-size:15px}
.login{max-width:440px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px;display:grid;gap:14px}
.login h1{font:700 34px/1.05 var(--disp)}
.login p{margin:0;color:var(--muted)}
.err{color:var(--err);min-height:1.3em;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi span{color:var(--muted);font-size:14px;font-weight:500}
.kpi strong{font:700 38px/1.05 var(--disp);font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hd h2{font:700 22px/1.1 var(--disp);letter-spacing:.01em;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;min-height:36px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--steel);color:var(--steel-ink)}
.mini{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:14px;font-weight:500}
.mini:hover{background:var(--bg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;box-shadow:0 6px 18px rgba(10,15,22,.25);white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums}
.tip b{display:block;margin-bottom:2px}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:9px 8px;border-top:1px solid var(--line);text-align:right;vertical-align:middle}
td.t{text-align:left;min-width:170px}
td.t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px;font-weight:500}
.meter{height:6px;border-radius:3px;background:var(--track);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--bar);border-radius:3px}
.rank{color:var(--muted);width:28px}
ul.rows{list-style:none;margin:0;padding:0;display:grid}
ul.rows li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
ul.rows li:first-child{border-top:0}
ul.rows .a{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.rows .b{color:var(--muted);font-size:13px;grid-column:1}
ul.rows .n{grid-row:1;grid-column:2;font-variant-numeric:tabular-nums;font-weight:600}
ul.rows .m{grid-column:1/3}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.empty{color:var(--muted);margin:0;padding:8px 0}
ul.rows.feed li{grid-template-columns:96px minmax(0,1fr) auto;align-items:baseline}ul.rows.feed .b{grid-row:auto;grid-column:3}ul.rows.feed .a{grid-column:2}ul.rows.feed .k{grid-column:1}
.feed .k{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-width:78px}
.feed .a{white-space:normal}
.small{color:var(--muted);font-size:13px;margin:10px 0 0}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.who{display:none}}
@media (prefers-reduced-motion:no-preference){.kpi strong{transition:opacity .2s}}
</style>

function loadScript(src){return new Promise(function(ok,no){var t=document.createElement("script");t.src=src;t.onload=ok;t.onerror=no;document.head.appendChild(t)})}

function loadReal(days){

  return Promise.all([

    db.collection("events").orderBy("ts","desc").limit(40).get()

/* ---------- aggregation ---------- */
function sum(rows,k){return rows.reduce(function(a,r){return a+(r[k]||0)},0)}
function mergeMap(rows,k){var o={};rows.forEach(function(r){var m=r[k]||{};Object.keys(m).forEach(function(x){o[x]=(o[x]||0)+(typeof m[x]==="number"?m[x]:0)})});return o}

var pendL=null;
function listings(){var box=$("lst");if(!box)return;if(state.demo||!state.db){box.innerHTML='<p class="empty">Not available in demo mode.</p>';return}
  state.db.collection("listings").get().then(function(q){

    box.querySelectorAll("[data-lh]").forEach(function(b){b.onclick=function(){var on=b.dataset.on==="1";state.db.doc("listings/"+b.dataset.lh).update({pub:!on,hidden:on,mt:Date.now()}).then(listings).catch(function(e){alert("Couldn’t update: "+(e&&e.code))})}});
    box.querySelectorAll("[data-ld]").forEach(function(b){b.onclick=function(){var id=b.dataset.ld;if(pendL!==id){pendL=id;listings();return}pendL=null;
      state.db.doc("listingPhotos/"+id).delete().catch(function(){}).then(function(){return state.db.doc("listings/"+id).delete()}).then(listings).catch(function(e){alert("Couldn’t delete: "+(e&&e.code))})}})
  }).catch(function(e){box.innerHTML='<p class="empty">Couldn’t load listings ('+esc(e&&e.code||"error")+'). Publish the updated Firestore rules, then refresh.</p>'})}

function traffic(c){
  var box=$("traf");
  if(state.view==="table"){box.innerHTML='<div class="scroll"><table><thead><tr><th>Date</th><th>Visitors</th><th>Page views</th><th>Property views</th><th>Sign-ups</th></tr></thead><tbody>'+c.slice().reverse().map(function(r){return'<tr><td>'+fmtD(r.id)+'</td><td>'+nf(r.vis)+'</td><td>'+nf(r.pv)+'</td><td>'+nf(r.lvw)+'</td><td>'+nf(r.su)+'</td></tr>'}).join("")+'</tbody></table></div>';return}
  var W=720,H=250,m={l:44,r:14,t:10,b:28},pw=W-m.l-m.r,ph=H-m.t-m.b,n=c.length,mx=Math.max(4,Math.max.apply(null,c.map(function(r){return Math.max(r.pv||0,r.vis||0)})));
  var step=mx<=10?2:mx<=30?5:mx<=60?10:mx<=150?20:mx<=300?50:mx<=800?100:mx<=2000?250:500,top=Math.ceil(mx/step)*step;
  var X=function(i){return m.l+(n<2?pw/2:i/(n-1)*pw)},Y=function(v){return m.t+ph-v/top*ph};
  var g="",i;for(var v=0;v<=top;v+=step)g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(m.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+nf(v)+'</text>';
  var ticks=Math.min(6,n),xl="";for(i=0;i<ticks;i++){var ix=ticks===1?0:Math.round(i*(n-1)/(ticks-1));xl+='<text x="'+X(ix)+'" y="'+(H-6)+'" text-anchor="'+(i===0?"start":i===ticks-1?"end":"middle")+'" font-size="12" fill="var(--muted)">'+fmtD(c[ix].id)+'</text>'}
  var line=function(k,col){return'<polyline fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+c.map(function(r,i){return X(i).toFixed(1)+","+Y(r[k]||0).toFixed(1)}).join(" ")+'"/>'};
  var last=c[n-1];
  box.innerHTML='<div class="legend"><span><i style="background:var(--s1)"></i>Visitors</span><span><i style="background:var(--s2)"></i>Page views</span></div><div class="chart" id="ch"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily visitors and page views for the last '+state.days+' days">'+g+xl+line("pv","var(--s2)")+line("vis","var(--s1)")
   +'<circle cx="'+X(n-1)+'" cy="'+Y(last.pv||0)+'" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><circle cx="'+X(n-1)+'" cy="'+Y(last.vis||0)+'" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>'
   +'<line id="cx" y1="'+m.t+'" y2="'+(m.t+ph)+'" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><rect id="hit" x="'+m.l+'" y="'+m.t+'" width="'+pw+'" height="'+ph+'" fill="transparent"/></svg><div class="tip" id="tip" hidden></div></div>';
  var ch=$("ch"),svg=ch.querySelector("svg"),tip=$("tip"),cx=$("cx");
  function mv(e){var b=svg.getBoundingClientRect(),px=(e.clientX-b.left)/b.width*W,i=Math.max(0,Math.min(n-1,Math.round((px-m.l)/pw*(n-1)))),r=c[i];cx.setAttribute("x1",X(i));cx.setAttribute("x2",X(i));cx.setAttribute("visibility","visible");
    tip.hidden=false;tip.innerHTML='<b>'+fmtD(r.id)+'</b>Visitors '+nf(r.vis)+'<br>Page views '+nf(r.pv)+'<br>Sign-ups '+nf(r.su);
    var tx=X(i)/W*b.width,tw=tip.offsetWidth;tip.style.left=Math.max(0,Math.min(b.width-tw,tx+12))+"px";tip.style.top="8px"}
  function lv(){tip.hidden=true;cx.setAttribute("visibility","hidden")}
  svg.addEventListener("pointermove",mv);svg.addEventListener("pointerdown",mv);svg.addEventListener("pointerleave",lv)}

function props(c){
  var V=mergeMap(c,"lv"),E=mergeMap(c,"le"),Sv=mergeMap(c,"ls"),C=mergeMap(c,"lc"),T={};
  c.forEach(function(r){var m=r.ln||{};Object.keys(m).forEach(function(k){T[k]=m[k]})});
  var ids=Object.keys(V);ids.forEach(function(k){if(!(k in E))E[k]=0;if(!(k in Sv))Sv[k]=0;if(!(k in C))C[k]=0});
  var key={v:V,e:E,s:Sv}[state.sortKey];
  ids.sort(function(a,b){return(key[b]-key[a])||(V[b]-V[a])});
  var box=$("props");if(!ids.length){box.innerHTML='<p class="empty">No property views in this period yet.</p>';return}
  var top=ids.slice(0,15),mx=Math.max.apply(null,top.map(function(k){return key[k]}))||1;
  box.innerHTML='<div class="scroll"><table><thead><tr><th>Property</th><th>Views</th><th>Emails</th><th>Calls</th><th>Saves</th><th>Email rate</th></tr></thead><tbody>'+top.map(function(k,i){var rate=V[k]?(E[k]/V[k]*100).toFixed(1)+"%":"–";return'<tr><td class="t"><div title="'+esc(T[k]||k)+'"><span class="rank">'+(i+1)+'. </span>'+esc(T[k]||k)+'</div><div class="meter"><i style="width:'+Math.max(2,key[k]/mx*100)+'%"></i></div></td><td>'+nf(V[k])+'</td><td>'+nf(E[k])+'</td><td>'+nf(C[k])+'</td><td>'+nf(Sv[k])+'</td><td>'+rate+'</td></tr>'}).join("")+'</tbody></table></div>'+(ids.length>15?'<p class="small">Showing the top 15 of '+ids.length+' viewed properties.</p>':'')}

function signups(list){
  var box=$("sups");$("suc").textContent=list.length?"· "+list.length+(list.length>=500?"+":"")+" accounts":"";
  if(!list.length){box.innerHTML='<p class="empty">No sign-ups recorded yet. Each person is added here the first time they sign up or sign in on the live site. Earlier accounts appear once their owner signs in again.</p>';return}
  var n=state.suN||25;
  box.innerHTML='<div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Method</th><th>Joined</th></tr></thead><tbody>'+list.slice(0,n).map(function(s){return'<tr><td class="t"><div>'+esc(s.name||"(no name)")+'</div></td><td><a href="mailto:'+esc(s.email||"")+'">'+esc(s.email||"")+'</a></td><td>'+esc(s.role||"–")+'</td><td>'+esc(s.provider||"email")+'</td><td>'+(s.ms?ago(s.ms):"–")+'</td></tr>'}).join("")+'</tbody></table></div>'+(list.length>n?'<p class="small"><button class="mini" id="sumore" type="button">Show more ('+(list.length-n)+')</button></p>':"");
  var mb=$("sumore");if(mb)mb.onclick=function(){state.suN=n+50;signups(list)}}

function searches(c){
  var q=mergeMap(c,"sq"),k=Object.keys(q).sort(function(a,b){return q[b]-q[a]}).slice(0,8),box=$("srch");
  if(!k.length){box.innerHTML='<p class="empty">No searches yet.</p>';return}
  var mx=q[k[0]];box.innerHTML='<ul class="rows">'+k.map(function(x){return'<li><span class="a">'+esc(x.replace(/_/g," "))+'</span><span class="n">'+nf(q[x])+'</span><div class="meter m"><i style="width:'+q[x]/mx*100+'%"></i></div></li>'}).join("")+'</ul>'}

function refs(c){
  var q=mergeMap(c,"rf"),k=Object.keys(q).sort(function(a,b){return q[b]-q[a]}).slice(0,8),box=$("refs"),dv=mergeMap(c,"dv");
  if(!k.length){box.innerHTML='<p class="empty">No traffic recorded yet.</p>';return}
  var mx=q[k[0]],tot=(dv.m||0)+(dv.d||0);
  box.innerHTML='<ul class="rows">'+k.map(function(x){return'<li><span class="a">'+esc(x.replace(/_/g,"."))+'</span><span class="n">'+nf(q[x])+'</span><div class="meter m"><i style="width:'+q[x]/mx*100+'%"></i></div></li>'}).join("")+'</ul>'+(tot?'<p class="small">'+Math.round((dv.m||0)/tot*100)+'% on phones, '+Math.round((dv.d||0)/tot*100)+'% on computers.</p>':'')}

function other(c){
  var R=[["Map views","mv"],["Properties saved","sv"],["Phone taps","ca"],["Sign-ins","si"],["New listings posted","nl"]];
  $("oth").innerHTML='<ul class="rows">'+R.map(function(r){return'<li><span class="a">'+r[0]+'</span><span class="n">'+nf(sum(c,r[1]))+'</span></li>'}).join("")+'</ul>'}

var LBL={listing:"Viewed",email:"Emailed",save:"Saved",search:"Searched",signup:"Sign-up",signin:"Sign-in",map:"Map view",newlisting:"New listing",call:"Phone tap"};
function feed(ev){
  var box=$("feed");if(!ev.length){box.innerHTML='<p class="empty">No activity recorded yet.</p>';return}
  box.innerHTML='<ul class="rows feed">'+ev.slice(0,20).map(function(e){var what=e.ti||(e.q?"“"+e.q.replace(/_/g," ")+"”":"");return'<li><span class="k">'+esc(LBL[e.t]||e.t)+'</span><span class="a">'+esc(what)+'</span><span class="b" style="grid-column:auto">'+(e.ms?ago(e.ms):"")+'</span></li>'}).join("")+'</ul>'}

function csv(list){
  var rows=[["Name","Email","Role","Sign-in method","Signed up"]].concat(list.map(function(s){return[s.name||"",s.email||"",s.role||"",s.provider||"",s.ms?new Date(s.ms).toISOString():""]}));
  var t=rows.map(function(r){return r.map(function(x){return'"'+String(x).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="comprops-signups.csv";document.body.appendChild(a);a.click();a.remove()}catch(e){}}

/* ---------- start ---------- */
function showDemo(why){state.demo=true;state.demoWhy=why;state.user=null;state.data=demoData(state.days);dash()}
function boot(refresh){
  if(state.demo){state.data=demoData(state.days);dash();return}
  app.innerHTML='<main><p class="empty" style="padding-top:20vh;text-align:center">Loading…</p></main>';
  loadReal(state.days).then(function(d){state.data=d;dash()}).catch(function(e){
    var denied=e&&e.code==="permission-denied";
    loginView(denied?"This account isn’t approved, or the Firestore rules haven’t been published yet.":"Couldn’t load the data. If this is your first time, create the Firestore database and publish the rules, then refresh.",true)})}
(function(){
  if(location.hash==="#demo"){showDemo("Demo mode: these numbers are made up so you can see the layout.");return}
  app.innerHTML='<main><p class="empty" style="padding-top:20vh;text-align:center">Loading…</p></main>';
  initFirebase().then(function(){
    state.auth.onAuthStateChanged(function(u){
      state.user=u;
      if(!u){loginView("");return}
      if(ADMINS.indexOf((u.email||"").toLowerCase())<0||!u.emailVerified){loginView((u.email||"That account")+" isn’t on the approved list.",false);return}
      boot()})
  }).catch(function(){showDemo("This preview can’t reach the live database, so sample numbers are shown. On comprops.com/admin.html you will see real activity.")})
})();
</script>
